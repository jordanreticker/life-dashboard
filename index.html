<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dashboard"/>
<title>Life Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F4F2ED;--surface:#fff;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.15);
  --text:#18180F;--t2:#6A6A62;--t3:#AEADA6;--r:14px;--r2:9px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --chome:#2563EB;--chealth:#16A34A;--csocial:#9333EA;--cwork:#D97706;--cchores:#0891B2;--cfin:#059669;--cjournal:#DB2777;
  --xp:#F59E0B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overscroll-behavior:none;}
button,input,select,textarea{font-family:'DM Sans',sans-serif;}

#app{display:flex;flex-direction:column;min-height:100dvh;max-width:480px;margin:0 auto;}
#main{flex:1;overflow-y:auto;padding:calc(var(--safe-t) + 72px) 12px 32px;}
#tabbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,0.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:0.5px solid var(--border);display:flex;padding:calc(var(--safe-t) + 4px) 0 4px;z-index:50;}
#tabbar.hidden{display:none;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;cursor:pointer;padding:4px 0;color:var(--t3);transition:color 0.15s;}
.tab.active{color:var(--text);}
.tab-ic{font-size:19px;line-height:1;}
.tab-lbl{font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
.pane{display:none;animation:fi 0.15s ease;}
.pane.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* top */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.topbar h1{font-size:20px;font-weight:300;letter-spacing:-0.4px;line-height:1.15;}
.topbar h1 b{font-weight:500;}
.topbar-r{text-align:right;}
.topbar-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);line-height:1.7;}
.sync-row{display:flex;align-items:center;gap:5px;margin-bottom:16px;}
.pip{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background 0.3s;}
.pip.synced{background:#16A34A;}.pip.syncing{background:#D97706;animation:blink 0.8s infinite;}.pip.error{background:#DC2626;}
.sync-txt{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* xp */
.xp-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:11px;margin-bottom:10px;}
.xp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.xp-lbl{font-size:13px;font-weight:500;}
.xp-pts{font-size:11px;font-family:'DM Mono',monospace;color:var(--t2);}
.xp-track{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;}
.xp-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#F59E0B,#EF4444);transition:width 0.7s ease;}
.badges-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.bp{font-size:10px;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;background:#FEF3C7;color:#92400E;border:0.5px solid #FCD34D;}

/* streak */
.streak-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.streak-ic{font-size:36px;line-height:1;}
.streak-info h3{font-size:19px;font-weight:300;letter-spacing:-0.5px;}
.streak-info p{font-size:11px;color:var(--t2);font-family:'DM Mono',monospace;margin-top:2px;}
.streak-best{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;}

/* week bar */
.week-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.week-title{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;}
.week-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ws{text-align:center;}
.ws-n{font-size:20px;font-weight:300;letter-spacing:-0.5px;}
.ws-l{font-size:9px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;}

/* summary grid */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.sc{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:transform 0.1s;}
.sc:active{transform:scale(0.98);}
.sc-accent{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:var(--r) 0 0 var(--r);}
.sc-icon{font-size:20px;margin-bottom:4px;}
.sc-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.sc-big{font-size:22px;font-weight:300;letter-spacing:-1px;line-height:1;}
.sc-sub{font-size:11px;color:var(--t2);margin-top:3px;}
.sc-bar{height:3px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden;}
.sc-bar-fill{height:100%;border-radius:2px;transition:width 0.5s;}
.sc-over{font-size:10px;font-family:'DM Mono',monospace;color:#DC2626;margin-top:3px;}

.overdue-banner{background:#FEF2F2;border:0.5px solid #FECACA;border-radius:var(--r2);padding:10px 14px;margin-bottom:10px;font-size:13px;color:#DC2626;}

/* section card */
.sec{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.sec-hd{display:flex;align-items:center;gap:10px;padding:11px 12px 10px;}
.sec-ic{font-size:18px;flex-shrink:0;}
.sec-name{flex:1;font-size:14px;font-weight:500;}
.sbadge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px;}
.sw{background:#FFF7ED;color:#C2410C;}.sok{background:#F0FDF4;color:#15803D;}.sn{background:var(--bg);color:var(--t2);}
.prog{height:2px;background:var(--bg);margin:0 14px;}
.prog-f{height:100%;border-radius:1px;transition:width 0.4s;}

/* tasks */
.tlist{padding:6px 8px 2px;}
.pg{margin-bottom:10px;}
.plbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.07em;padding:4px 2px 5px;border-bottom:0.5px solid var(--border);margin-bottom:5px;}
.trow{display:flex;align-items:flex-start;gap:9px;padding:7px 5px;border-radius:var(--r2);margin-bottom:2px;transition:background 0.1s;}
.trow:active{background:var(--bg);}
.trow.overdue-row{background:#FEF2F2;}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;margin-top:1px;}
.chk.ck{background:#16A34A;border-color:#16A34A;}
.chk.ck::after{content:'';width:5px;height:9px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(42deg) translateY(-1px);display:block;}
.tbody{flex:1;min-width:0;}
.ttxt{font-size:14px;line-height:1.4;}
.trow.done-r .ttxt{color:var(--t3);text-decoration:line-through;}
.tmeta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;}
.tpri{font-size:10px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:4px;}
.pu{background:#FEF2F2;color:#DC2626;}.ph{background:#FFF7ED;color:#C2410C;}.pm{background:#FEFCE8;color:#A16207;}.pl{background:#F0FDF4;color:#15803D;}
.tdate{font-size:10px;font-family:'DM Mono',monospace;color:var(--t2);}
.tdate.od{color:#DC2626;font-weight:500;}
.ttag{font-size:10px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:4px;background:#EDE9F8;color:#7C3AED;}
.tsched{font-size:10px;font-family:'DM Mono',monospace;color:#7C3AED;}
.tacts{display:flex;gap:1px;flex-shrink:0;margin-top:1px;}
.abtn{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);cursor:pointer;padding:3px 5px;border-radius:5px;opacity:0;transition:opacity 0.15s,background 0.15s;border:none;background:none;}
.trow:hover .abtn{opacity:1;}
.abtn:hover{background:var(--bg);color:var(--text);}
.abtn.del:hover{background:#FEE2E2;color:#DC2626;}
.abtn.edit-btn:hover{background:#EDE9F8;color:#7C3AED;}
.emsg{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;padding:4px 2px 8px;}

/* add row */
.add-wrap{padding:8px 10px 10px;border-top:0.5px solid var(--border);}
.add-main{display:flex;gap:5px;margin-bottom:6px;}
.add-extras{display:flex;gap:5px;flex-wrap:wrap;}
.inp{font-size:14px;padding:9px 11px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);outline:none;}
.inp:focus{border-color:rgba(0,0,0,0.3);background:#fff;}
.inp::placeholder{color:var(--t3);}
.inp.f1{flex:1;min-width:0;}
.sel{font-family:'DM Mono',monospace;font-size:11px;padding:9px 6px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);outline:none;cursor:pointer;}
.dtp{font-family:'DM Mono',monospace;font-size:11px;padding:9px 8px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);outline:none;}
.badd{font-size:13px;font-weight:500;padding:9px 14px;border-radius:var(--r2);border:none;background:var(--text);color:#fff;cursor:pointer;white-space:nowrap;}
.badd:active{opacity:0.7;}
.bsm{font-size:12px;padding:7px 11px;border-radius:var(--r2);border:0.5px solid var(--border2);background:transparent;color:var(--t2);cursor:pointer;white-space:nowrap;}
.bsm:hover{background:var(--bg);}

/* people */
.pbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px;}
.pchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:'DM Mono',monospace;padding:4px 10px;border-radius:20px;background:#F5F3FF;border:0.5px solid rgba(147,51,234,0.2);color:#7C3AED;}
.cdel{cursor:pointer;color:rgba(124,58,237,0.5);font-size:11px;}
.cdel:hover{color:#DC2626;}
.apr{display:flex;gap:5px;padding:0 10px 10px;}
.div{height:0.5px;background:var(--border);margin:0 10px 8px;}

/* chores */
.crow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:var(--r2);margin-bottom:3px;cursor:pointer;transition:background 0.15s;}
.crow:hover{background:var(--bg);}
.cinfo{flex:1;min-width:0;}
.cname{font-size:14px;}
.clast{font-size:11px;font-family:'DM Mono',monospace;margin-top:1px;}
.fwrap{width:54px;flex-shrink:0;}
.ftrack{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;border:0.5px solid var(--border);margin-bottom:2px;}
.ffill{height:100%;border-radius:3px;transition:width 0.5s;}
.flbl{font-size:9px;font-family:'DM Mono',monospace;text-align:right;}
.cdelbtn{font-size:12px;color:var(--t3);cursor:pointer;padding:4px 5px;border-radius:5px;opacity:0;border:none;background:none;}
.crow:hover .cdelbtn{opacity:1;}
.cdelbtn:hover{background:#FEE2E2;color:#DC2626;}
.hint{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);padding:2px 10px 8px;}

/* activities */
.act-types{display:flex;flex-wrap:wrap;gap:6px;padding:10px;}
.atbtn{font-size:12px;font-family:'DM Mono',monospace;padding:6px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);cursor:pointer;transition:all 0.15s;}
.atbtn:hover{background:var(--text);color:#fff;border-color:var(--text);}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px 10px;}
.wday{display:flex;flex-direction:column;align-items:center;gap:3px;}
.wdlbl{font-size:9px;font-family:'DM Mono',monospace;color:var(--t3);}
.wddot{width:30px;height:30px;border-radius:50%;background:var(--bg);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);}
.wddot.has{background:var(--text);color:#fff;border-color:var(--text);}
.wddot.tod{border:2px solid var(--chealth);}
.alog{padding:0 10px 10px;}
.ali{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.ali:last-child{border-bottom:none;}
.atbadge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--t2);flex-shrink:0;}
.aldate{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);}
.alnotes{font-size:13px;flex:1;}

/* question */
.qcard{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;text-align:center;}
.qlbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:14px;}
.qtxt{font-size:15px;font-weight:300;line-height:1.5;letter-spacing:-0.2px;min-height:60px;display:flex;align-items:center;justify-content:center;}
.qbtn{font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--r2);border:none;background:var(--csocial);color:#fff;cursor:pointer;margin-top:12px;width:100%;}
.qbtn:active{opacity:0.8;}
.qcount{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);margin-top:8px;}

/* finances */
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;}
.fcard{background:var(--bg);border-radius:var(--r2);padding:12px;position:relative;}
.fcard-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);margin-bottom:4px;}
.fcard-amt{font-size:19px;font-weight:300;letter-spacing:-0.5px;}
.fcard-type{font-size:10px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:4px;display:inline-block;margin-top:3px;}
.ftype-expense{background:#FEF2F2;color:#DC2626;}
.ftype-income{background:#F0FDF4;color:#15803D;}
.ftype-savings{background:#EFF6FF;color:#1D4ED8;}
.fedit{position:absolute;top:8px;right:8px;font-size:11px;color:var(--t3);cursor:pointer;padding:2px 5px;border-radius:4px;border:none;background:none;opacity:0;}
.fcard:hover .fedit{opacity:1;}
.fadd-row{display:flex;flex-direction:column;gap:6px;padding:0 10px 12px;}
.fin-summary{display:flex;gap:8px;padding:0 10px 10px;}
.fin-sum-item{flex:1;background:var(--bg);border-radius:var(--r2);padding:10px;text-align:center;}
.fin-sum-n{font-size:18px;font-weight:300;letter-spacing:-0.5px;}
.fin-sum-l{font-size:9px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;margin-top:2px;}

/* journal */
.jform{padding:10px;}
.mood-row{display:flex;gap:8px;margin-bottom:8px;}
.moodbtn{font-size:20px;padding:6px 10px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);cursor:pointer;transition:all 0.15s;line-height:1;}
.moodbtn.sel{background:var(--text);border-color:var(--text);}
.jta{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);outline:none;resize:none;min-height:80px;line-height:1.5;}
.jta:focus{border-color:rgba(0,0,0,0.3);background:#fff;}
.jentries{padding:0 10px 10px;}
.jentry{padding:10px 0;border-bottom:0.5px solid var(--border);}
.jentry:last-child{border-bottom:none;}
.jemood{font-size:16px;}
.jedate{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);}
.jetxt{font-size:14px;margin-top:4px;line-height:1.5;}

/* modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
.mback.hide{display:none;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--safe-b));width:100%;max-width:480px;}
.modal h3{font-size:16px;font-weight:500;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;margin-bottom:16px;}
.mbtn{display:block;width:100%;text-align:left;font-size:15px;padding:14px 16px;border-radius:var(--r2);border:0.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;margin-bottom:8px;}
.mbtn:active{opacity:0.7;}
.mcancel{background:transparent;border-color:transparent;color:var(--t3);}
.edit-form{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}

/* toast */
.toast{position:fixed;bottom:calc(96px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:#fff;font-size:13px;font-family:'DM Mono',monospace;padding:10px 18px;border-radius:20px;opacity:0;transition:all 0.3s;z-index:300;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* confetti canvas */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:400;}

.loading{text-align:center;padding:48px 0;color:var(--t3);font-size:13px;font-family:'DM Mono',monospace;}
.loading::after{content:'...';animation:dots 1.2s infinite;}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
</style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div id="app">
  <div id="main">
    <div class="pane active" id="pane-home">
      <div class="topbar"><div><h1>JrDr's<br/><b>Office</b></h1></div><div class="topbar-r"><div class="topbar-date" id="top-date"></div></div></div>
      <div class="sync-row"><div class="pip" id="sync-pip"></div><span class="sync-txt" id="sync-txt">connecting</span></div>
      <div id="home-content"><div class="loading">loading</div></div>
    </div>
    <div class="pane" id="pane-health"><div class="topbar"><h1><b>🏃 Health</b></h1></div><div id="health-content"><div class="loading">loading</div></div></div>
    <div class="pane" id="pane-paige"><div class="topbar"><h1><b>💕 Paige</b></h1></div><div id="paige-content"><div class="loading">loading</div></div></div>
    <div class="pane" id="pane-social"><div class="topbar"><h1><b>👥 Friends</b></h1></div><div id="social-content"><div class="loading">loading</div></div></div>
    <div class="pane" id="pane-work"><div class="topbar"><h1><b>💼 Work</b></h1></div><div id="work-content"><div class="loading">loading</div></div></div>
    <div class="pane" id="pane-chores"><div class="topbar"><h1><b>🏠 Home</b></h1></div><div id="chores-content"><div class="loading">loading</div></div></div>
    <div class="pane" id="pane-fin"><div class="topbar"><h1><b>💰 Finances</b></h1></div><div id="fin-content"><div class="loading">loading</div></div></div>
    <div class="pane" id="pane-journal"><div class="topbar"><h1><b>📓 Journal</b></h1></div><div id="journal-content"><div class="loading">loading</div></div></div>
  </div>
  <nav id="tabbar">
    <button class="tab active" data-tab="home"><span class="tab-ic">⊙</span><span class="tab-lbl">Home</span></button>
    <button class="tab" data-tab="paige"><span class="tab-ic">💕</span><span class="tab-lbl">Paige</span></button>
    <button class="tab" data-tab="health"><span class="tab-ic">🏃</span><span class="tab-lbl">Health</span></button>
    <button class="tab" data-tab="social"><span class="tab-ic">👥</span><span class="tab-lbl">Friends</span></button>
    <button class="tab" data-tab="work"><span class="tab-ic">💼</span><span class="tab-lbl">Work</span></button>
    <button class="tab" data-tab="chores"><span class="tab-ic">🧹</span><span class="tab-lbl">Chores</span></button>
    <button class="tab" data-tab="fin"><span class="tab-ic">💰</span><span class="tab-lbl">Money</span></button>
    <button class="tab" data-tab="journal"><span class="tab-ic">📓</span><span class="tab-lbl">Journal</span></button>
  </nav>
</div>

<!-- Chore modal -->
<div class="mback hide" id="chore-modal">
  <div class="modal"><h3 id="cm-title"></h3><div class="modal-sub" id="cm-sub"></div>
    <button class="mbtn" id="cm-confirm">✓ Just did this</button>

// ── Confetti ──────────────────────────────────────────────────────────────────
function fireConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const pieces=[];
  const colors=['#F59E0B','#EF4444','#8B5CF6','#10B981','#3B82F6','#EC4899','#F97316'];
  for(let i=0;i<80;i++){
    pieces.push({
      x:Math.random()*canvas.width,y:-10,
      vx:(Math.random()-0.5)*4,vy:Math.random()*4+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      size:Math.random()*8+4,
      rot:Math.random()*360,vrot:(Math.random()-0.5)*10,
      life:1,
    });
  }
  let frame;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    pieces.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.rot+=p.vrot;p.life-=0.012;
      if(p.life>0&&p.y<canvas.height+20){alive=true;}
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      ctx.restore();
    });
    if(alive)frame=requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
  setTimeout(()=>{cancelAnimationFrame(frame);ctx.clearRect(0,0,canvas.width,canvas.height);},3000);
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadData(){
  setSync('syncing','loading');
  try{
    const res=await fetch(API+'?action=getData');
    const data=await res.json();
    if(data.tasks) D.tasks=data.tasks.map(t=>({...t,done:t.done===true||t.done==='TRUE',tags:Array.isArray(t.tags)?t.tags:(t.tags?String(t.tags).split(',').filter(Boolean):[]),dueDate:t.dueDate||'',priority:t.priority||'',scheduledFor:t.scheduledFor||''}));
    if(data.chores&&data.chores.length) D.chores=data.chores; else D.chores=JSON.parse(JSON.stringify(DEFAULT_CHORES));
    if(data.people) D.people={social:data.people.social||[],work:data.people.work||[]};
    if(data.activities) D.activities=data.activities;
    if(data.questions&&data.questions.length) D.questions=data.questions.map(q=>typeof q==='object'?(q.question||''):q).filter(Boolean);
    if(data.gamification){
      const g=data.gamification;
      D.gamification={...D.gamification,...g,
        xp:Number(g.xp)||0,level:Number(g.level)||1,streakDays:Number(g.streakDays)||0,
        bestStreak:Number(g.bestStreak)||0,totalTasksDone:Number(g.totalTasksDone)||0,
        totalChoresDone:Number(g.totalChoresDone)||0,totalActivities:Number(g.totalActivities)||0,
        badges:Array.isArray(g.badges)?g.badges:(g.badges?String(g.badges).split(',').filter(Boolean):[])
      };
    }
    if(data.finances) D.finances=data.finances.map(f=>({...f,amount:Number(f.amount)||0}));
    if(data.journal) D.journal=data.journal;
    if(data.weeklyStats) D.weeklyStats=data.weeklyStats;
    if(data.relActs&&data.relActs.length) D.relActs=data.relActs; else D.relActs=JSON.parse(JSON.stringify(RELATIONSHIP_ACTS));
    if(data.encycNotes) D.encycNotes=data.encycNotes;
    if(D.tasks.length) D.nextId=Math.max(...D.tasks.map(t=>Number(t.id)||0),D.nextId)+1;
    updateStreak();
    setSync('synced','synced');
  }catch(e){setSync('error','offline');}
  renderAll();
}

async function saveAll(){
  setSync('syncing','saving');
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'saveData',tasks:D.tasks,chores:D.chores,people:D.people,gamification:D.gamification,finances:D.finances,weeklyStats:D.weeklyStats,relActs:D.relActs,encycNotes:D.encycNotes})});

}

// ── Gamification ──────────────────────────────────────────────────────────────
function addXP(amt){
  D.gamification.xp+=amt;
  const newLvl=LEVEL_XP.findIndex((t,i)=>D.gamification.xp<(LEVEL_XP[i+1]||Infinity));
  const lvl=newLvl<0?LEVEL_XP.length-1:newLvl;
  if(lvl>D.gamification.level){D.gamification.level=lvl;toast('🎉 Level up! You\'re now '+LEVEL_NAMES[lvl],3000);fireConfetti();}
  checkBadges();
}
function checkBadges(){
  BADGES.forEach(b=>{
    if(!D.gamification.badges.includes(b.id)&&b.check(D.gamification,D.tasks,D.activities)){
      D.gamification.badges.push(b.id);
      toast(b.emoji+' Badge unlocked: '+b.label,3500);
    }
  });
}
function updateStreak(){
  const last=D.gamification.lastActiveDate;
  if(!last)return;
  const diff=Math.floor((TODAY-new Date(last))/86400000);
  if(diff>1){D.gamification.streakDays=0;}
}
function markActive(){
  const last=D.gamification.lastActiveDate;
  if(last===TODAY_ISO)return;
  const diff=last?Math.floor((TODAY-new Date(last))/86400000):999;
  if(diff===1)D.gamification.streakDays++;
  else if(diff>1)D.gamification.streakDays=1;
  else D.gamification.streakDays=Math.max(1,D.gamification.streakDays);
  if(D.gamification.streakDays>D.gamification.bestStreak)D.gamification.bestStreak=D.gamification.streakDays;
  D.gamification.lastActiveDate=TODAY_ISO;
}
function xpPct(){
  const lvl=D.gamification.level;
  const base=LEVEL_XP[lvl]||0;const next=LEVEL_XP[lvl+1]||base+1000;
  return Math.min(100,Math.round((D.gamification.xp-base)/(next-base)*100));
}

// ── Weekly stats ──────────────────────────────────────────────────────────────
function getOrCreateWeek(){
  let w=D.weeklyStats.find(w=>w.weekStart===WEEK_START);
  if(!w){w={weekStart:WEEK_START,tasksDone:0,choresDone:0,activitiesLogged:0,xpEarned:0};D.weeklyStats.push(w);}
  return w;
}
function recordWeekTask(){const w=getOrCreateWeek();w.tasksDone++;w.xpEarned+=10;}
function recordWeekChore(){const w=getOrCreateWeek();w.choresDone++;w.xpEarned+=8;}
function recordWeekActivity(){const w=getOrCreateWeek();w.activitiesLogged++;w.xpEarned+=15;}

// ── Freshness ─────────────────────────────────────────────────────────────────
function fresh(c){
  if(!c.lastDone)return{pct:0,color:'#DC2626',label:'never'};
  const days=(Date.now()-new Date(c.lastDone))/86400000;
  const ratio=Math.max(0,1-days/c.intervalDays);
  const pct=Math.round(ratio*100);
  const color=ratio<0.25?'#DC2626':ratio<0.5?'#D97706':ratio<0.75?'#CA8A04':'#16A34A';
  return{pct,color,label:Math.round(days)===0?'today':Math.round(days)+'d ago'};
}

// ── Task actions ──────────────────────────────────────────────────────────────
function toggleTask(id){
  const t=D.tasks.find(t=>t.id==id);if(!t)return;
  t.done=!t.done;
  if(t.done){
    const xp=t.priority==='urgent'?20:t.priority==='high'?15:t.priority==='medium'?10:5;
    addXP(xp);markActive();
    D.gamification.totalTasksDone++;recordWeekTask();
    fireConfetti();toast('✓ Done! +'+xp+' XP');
  }
  renderAll();sched();
}
function deleteTask(id){D.tasks=D.tasks.filter(t=>t.id!=id);renderAll();sched();}
function dupeTask(id){
  const t=D.tasks.find(t=>t.id==id);if(!t)return;
  const next=new Date();next.setDate(next.getDate()+7);
  const lbl=next.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  D.tasks.push({...t,id:D.nextId++,done:false,scheduledFor:lbl,dueDate:''});
  renderAll();sched();toast('📋 Duped → '+lbl);

// ── PAIGE ─────────────────────────────────────────────────────────────────────
function rPaige(){
  // seed relationship acts if not loaded
  if(!D.relActs||!D.relActs.length) D.relActs=JSON.parse(JSON.stringify(RELATIONSHIP_ACTS));

  const tasks=D.tasks.filter(t=>t.section==='paige'&&isSchedToday(t));
  const qs=D.questions;
  const q=qs.length?qs[D.paigeQIdx%qs.length]:null;
  const pend=tasks.filter(t=>!t.done).length;
  const pct=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0;
  const sortedActs=[...D.relActs].sort((a,b)=>fresh(a).pct-fresh(b).pct);
  const staleRel=sortedActs.filter(r=>fresh(r).pct<50).length;
  const encycOpen=D.encycOpen||false;

  let html='';

  // Question card
  if(q){html+=`<div class="qcard">
    <div class="qlbl">💬 ask paige</div>
    <div class="qtxt">${escH(q)}</div>
    <button class="qbtn" id="nxtq-paige">Next question ↻</button>
    <div class="qcount">${D.paigeQIdx%qs.length+1} of ${qs.length}</div>
  </div>`;}

  // Relationship freshness
  html+=`<div class="sec">
    <div class="sec-hd"><span class="sec-ic">💝</span><div class="sec-name">Relationship acts</div><span class="sbadge ${staleRel?'sw':'sok'}">${staleRel?staleRel+' overdue':'all good'}</span></div>
    <div class="tlist">
      ${sortedActs.map(r=>{const f=fresh(r);return`<div class="crow" data-rel="${r.id}">
        <div class="cinfo"><div class="cname">${escH(r.name)}</div><div class="clast" style="color:${f.color}">${f.label} · every ${r.intervalDays}d</div></div>
        <div class="fwrap"><div class="ftrack"><div class="ffill" style="width:${f.pct}%;background:${f.color}"></div></div><div class="flbl" style="color:${f.color}">${f.pct}%</div></div>
      </div>`;}).join('')}
    </div>
    <div class="hint">tap to mark done</div>
  </div>`;

  // Tasks
  html+=`<div class="sec">
    <div class="sec-hd"><span class="sec-ic">💕</span><div class="sec-name">Tasks</div><span class="sbadge ${pend?'sw':'sok'}">${pend} left</span></div>
    <div class="prog"><div class="prog-f" style="width:${pct}%;background:#DB2777"></div></div>
    <div class="tlist">${!tasks.length?'<div class="emsg">no tasks yet</div>':''}${tasks.map(t=>trow(t)).join('')}</div>
    <div class="add-wrap">
      <div class="add-main"><input class="inp f1" id="inp-paige" placeholder="Add a task for Paige..."/><button class="badd" data-ab="paige">Add</button></div>
      <div class="add-extras">
        <select class="sel" id="pr-paige"><option value="">priority</option><option value="urgent">urgent</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
        <input class="dtp" type="date" id="dt-paige"/>
      </div>
    </div>
  </div>`;

  // Paigecyclopedia
  const notes=D.encycNotes||[];
  html+=`<div class="sec">
    <div class="sec-hd" id="encyc-hd" style="cursor:pointer">
      <span class="sec-ic">📖</span>
      <div class="sec-name">Paigecyclopedia</div>
      <span class="sbadge sn">${notes.length} notes</span>
      <span class="sec-chev ${encycOpen?'open':''}">▼</span>
    </div>
    ${encycOpen?`
    <div class="tlist">
      ${!notes.length?'<div class="emsg">add gift ideas, things she loves, memories...</div>':''}
      ${notes.map((n,i)=>`<div class="trow" style="align-items:center">
        <div class="tbody"><div class="ttxt">${escH(n.text)}</div>${n.cat?`<div class="tmeta"><span class="ttag">${escH(n.cat)}</span></div>`:''}</div>
        <div class="tacts"><button class="abtn del" data-delnote="${i}">✕</button></div>
      </div>`).join('')}
    </div>
    <div class="add-wrap">
      <div class="add-main"><input class="inp f1" id="encyc-inp" placeholder="Add a note (gift idea, thing she likes...)"/><button class="badd" id="encyc-add">Add</button></div>
      <div class="add-extras">
        <input class="inp" id="encyc-cat" placeholder="category" style="width:110px;flex:none"/>
      </div>
    </div>`:``}
  </div>`;

  document.getElementById('paige-content').innerHTML=html;

  // question
  document.getElementById('nxtq-paige')?.addEventListener('click',()=>{D.paigeQIdx=(D.paigeQIdx||0)+1;rPaige();});

  // relationship act tap
  document.querySelectorAll('[data-rel]').forEach(el=>{
    el.addEventListener('click',()=>{
      const r=D.relActs.find(r=>r.id==el.dataset.rel);
      if(!r)return;
      if(confirm('Mark "'+r.name+'" as done today?')){
        r.lastDone=new Date().toISOString();addXP(12);markActive();
        toast('💕 Nice! +12 XP');fireConfetti();rPaige();sched();
      }
    });
  });

  // encyclopedia toggle
  document.getElementById('encyc-hd')?.addEventListener('click',e=>{
    if(e.target.closest('[data-delnote]')||e.target.closest('#encyc-add')||e.target.closest('#encyc-inp')||e.target.closest('#encyc-cat'))return;
    D.encycOpen=!D.encycOpen;rPaige();
  });

  // add note
  document.getElementById('encyc-add')?.addEventListener('click',()=>{
    const inp=document.getElementById('encyc-inp');
    const cat=document.getElementById('encyc-cat');
    if(!inp?.value.trim())return;
    if(!D.encycNotes)D.encycNotes=[];
    D.encycNotes.push({text:inp.value.trim(),cat:cat?.value.trim()||''});
    inp.value='';if(cat)cat.value='';
    rPaige();sched();
  });
  document.getElementById('encyc-inp')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('encyc-add')?.click();});

  // delete note
  document.querySelectorAll('[data-delnote]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();D.encycNotes.splice(parseInt(el.dataset.delnote),1);rPaige();sched();});
  });

  bindTaskEv('paige');
}

  const g=D.gamification;
  const active=D.tasks.filter(t=>isSchedToday(t));

      <div class="sc-sub">entries written</div>

  document.getElementById('home-content').innerHTML=html;

function sumCard(icon,name,color,tab,stat,extra){
  const pct=stat.all?Math.round(stat.done/stat.all*100):0;
  return`<div class="sc" onclick="switchTab('${tab}')">
    <div class="sc-accent" style="background:${color}"></div>
    <div class="sc-icon">${icon}</div>
    <div class="sc-lbl">${name}</div>
    <div class="sc-big">${stat.all-stat.done}</div>
    <div class="sc-sub">${stat.done}/${stat.all} done${extra?' · '+extra:''}</div>
    ${stat.over?`<div class="sc-over">${stat.over} overdue</div>`:''}
    <div class="sc-bar"><div class="sc-bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

      <button class="bsm" onclick="openFinModal(null)" style="flex:1">+ Add entry</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-hd"><span class="sec-ic">💡</span><div class="sec-name">Tip</div></div>
    <div style="padding:0 14px 14px;font-size:13px;color:var(--t2);line-height:1.6;">Track your monthly expenses, income, and savings goals here. For live bank data, log into Rocket Mortgage or your bank's app — this section is for awareness and manual tracking.</div>
  </div>`;
  document.getElementById('fin-content').innerHTML=html;
}

// ── JOURNAL ───────────────────────────────────────────────────────────────────
function rJournal(){
  const MOODS=['😊','😐','😔','😤','😴','🤩'];
  const prompts=D.selectedMood?MOOD_PROMPTS[D.selectedMood]:[];
  let html=`<div class="sec">
    <div class="sec-hd"><span class="sec-ic">✏️</span><div class="sec-name">Today's entry</div></div>
    <div class="jform">
      <div class="mood-row">${MOODS.map(m=>`<button class="moodbtn ${D.selectedMood===m?'sel':''}" data-mood="${m}">${m}</button>`).join('')}</div>
      ${prompts.length?`<div style="font-size:12px;color:var(--t2);background:var(--bg);border-radius:var(--r2);padding:10px 12px;margin-bottom:6px;line-height:1.7">${prompts.map(p=>`• ${p}`).join('<br>')}</div>`:''}
      <textarea class="jta" id="jtext" placeholder="${D.selectedMood?'Write your thoughts...':'Pick a mood above, then write...'}"></textarea>
      <button class="badd" style="width:100%;margin-top:6px" onclick="submitJournal()">Save entry</button>
    </div>
  </div>`;
  if(D.journal.length){html+=`<div class="sec">
    <div class="sec-hd"><span class="sec-ic">📚</span><div class="sec-name">Past entries</div><span class="sbadge sn">${D.journal.length}</span></div>
    <div class="jentries">${D.journal.slice(0,20).map(e=>`<div class="jentry">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span class="jemood">${e.mood||''}</span><span class="jedate">${fmtDate(e.date)}</span></div>
      <div class="jetxt">${escH(e.text)}</div>
    </div>`).join('')}</div>
  </div>`;}
  document.getElementById('journal-content').innerHTML=html;
  document.querySelectorAll('.moodbtn').forEach(b=>b.addEventListener('click',()=>{
    const prev=document.getElementById('jtext')?.value;
    D.selectedMood=b.dataset.mood;
    rJournal();
    const ta=document.getElementById('jtext');if(ta&&prev)ta.value=prev;
  }));
}

// ── Task section helper ───────────────────────────────────────────────────────
function taskSection(secId,title,color,tasks){
  const pend=tasks.filter(t=>!t.done).length;
  const pct=tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):0;
  return`<div class="sec">
    <div class="sec-hd"><div class="sec-name">${title}</div><span class="sbadge ${pend?'sw':'sok'}">${pend} left</span></div>
    <div class="prog"><div class="prog-f" style="width:${pct}%;background:${color}"></div></div>
    <div class="tlist">${!tasks.length?'<div class="emsg">no tasks yet</div>':''}${tasks.map(t=>trow(t)).join('')}</div>
    <div class="add-wrap">
      <div class="add-main"><input class="inp f1" id="inp-${secId}" placeholder="Add a task..."/><button class="badd" data-ab="${secId}">Add</button></div>
      <div class="add-extras">
        <select class="sel" id="pr-${secId}"><option value="">priority</option><option value="urgent">urgent</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
        <input class="dtp" type="date" id="dt-${secId}"/>
      </div>
    </div>
  </div>`;
}

function trow(t){
  const over=!t.done&&isOverdue(t.dueDate);
  const tags=Array.isArray(t.tags)?t.tags:[];
  const hasMeta=t.priority||t.dueDate||(tags.length>0)||t.scheduledFor;
  const priCls={urgent:'pu',high:'ph',medium:'pm',low:'pl'}[t.priority]||'';
  return`<div class="trow ${t.done?'done-r':''} ${over?'overdue-row':''}">
    <div class="chk ${t.done?'ck':''}" data-chk="${t.id}"></div>
    <div class="tbody">
      <div class="ttxt">${escH(t.text)}</div>
      ${hasMeta?`<div class="tmeta">
        ${t.priority?`<span class="tpri ${priCls}">${t.priority}</span>`:''}
        ${t.dueDate?`<span class="tdate ${over?'od':''}">${over?'overdue · ':''}${fmtDate(t.dueDate)}</span>`:''}
        ${tags.map(g=>`<span class="ttag">#${escH(g)}</span>`).join('')}
        ${t.scheduledFor?`<span class="tsched">→ ${escH(t.scheduledFor)}</span>`:''}
      </div>`:''}
    </div>
    <div class="tacts">
      <button class="abtn edit-btn" data-edit="${t.id}">✏️</button>
      <button class="abtn" data-dupe="${t.id}">+7d</button>
      <button class="abtn del" data-del="${t.id}">✕</button>
    </div>
  </div>`;
}

function bindTaskEv(secId){
  document.querySelectorAll('[data-chk]').forEach(el=>el.addEventListener('click',()=>toggleTask(el.dataset.chk)));
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>deleteTask(el.dataset.del)));
  document.querySelectorAll('[data-dupe]').forEach(el=>el.addEventListener('click',()=>dupeTask(el.dataset.dupe)));
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openEditTask(el.dataset.edit)));
  const ab=document.querySelector(`[data-ab="${secId}"]`);
  if(ab){ab.addEventListener('click',()=>{
    const inp=document.getElementById('inp-'+secId);if(!inp?.value.trim())return;
    const pri=document.getElementById('pr-'+secId)?.value;
    const dt=document.getElementById('dt-'+secId)?.value;
    const ps=document.getElementById('ps-'+secId)?.value;
    const ti=document.getElementById('tg-'+secId);
    const tags=ti?ti.value.split(/[\s,]+/).map(t=>t.replace(/^#/,'')).filter(Boolean):[];
    addTask(secId,inp.value,pri,dt,ps,tags);
    inp.value='';if(ti)ti.value='';
    const dp=document.getElementById('dt-'+secId);if(dp)dp.value='';
    const pp=document.getElementById('pr-'+secId);if(pp)pp.value='';
  });}
  const mi=document.getElementById('inp-'+secId);
  if(mi){mi.addEventListener('keydown',e=>{if(e.key==='Enter')ab?.click();});mi.addEventListener('click',e=>e.stopPropagation());}
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

loadData();
</script>
</body>
</html>
