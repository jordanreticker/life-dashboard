<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Dashboard"/>
<title>Life Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#F4F2ED; --surface:#fff; --surface2:#F9F8F5;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.14);
  --text:#18180F; --t2:#6A6A62; --t3:#AEADA6;
  --r:13px; --r2:8px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --chome:#2563EB; --chealth:#16A34A; --csocial:#9333EA; --cwork:#D97706; --cchores:#0891B2;
  --xp:#F59E0B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);overscroll-behavior:none;}
button,input,select{font-family:'DM Sans',sans-serif;}

/* ── Layout ── */
#app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;}
#main{flex:1;overflow-y:auto;padding:calc(var(--safe-t) + 16px) 16px 80px;}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:0.5px solid var(--border);display:flex;padding:8px 0 calc(8px + var(--safe-b));z-index:50;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 0;color:var(--t3);transition:color 0.15s;}
.tab-btn.active{color:var(--text);}
.tab-icon{font-size:20px;line-height:1;}
.tab-label{font-size:9px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;}
.tab-pane{display:none;animation:fadeIn 0.15s ease;}
.tab-pane.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Top bar ── */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.topbar-left h1{font-size:24px;font-weight:300;letter-spacing:-0.4px;line-height:1.15;}
.topbar-left h1 b{font-weight:500;}
.topbar-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);line-height:1.7;text-align:right;margin-top:2px;}
.sync-row{display:flex;align-items:center;gap:5px;margin-bottom:18px;}
.sync-pip{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background 0.3s;}
.sync-pip.synced{background:#16A34A;} .sync-pip.syncing{background:#D97706;animation:blink 0.8s infinite;} .sync-pip.error{background:#DC2626;}
.sync-txt{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── XP bar ── */
.xp-bar-wrap{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:16px;}
.xp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.xp-level{font-size:13px;font-weight:500;} .xp-pts{font-size:11px;font-family:'DM Mono',monospace;color:var(--t2);}
.xp-track{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.xp-fill{height:100%;border-radius:3px;background:var(--xp);transition:width 0.6s ease;}
.xp-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.badge-pill{font-size:10px;font-family:'DM Mono',monospace;padding:3px 9px;border-radius:20px;background:#FEF3C7;color:#92400E;border:0.5px solid #FCD34D;}

/* ── Summary cards ── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.summary-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;cursor:pointer;transition:box-shadow 0.15s;}
.summary-card:active{box-shadow:0 0 0 2px rgba(0,0,0,0.1);}
.sc-accent{position:absolute;top:0;left:0;width:4px;height:100%;border-radius:var(--r) 0 0 var(--r);}
.sc-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.sc-big{font-size:28px;font-weight:300;letter-spacing:-1px;line-height:1;}
.sc-sub{font-size:11px;color:var(--t2);margin-top:4px;}
.sc-bar{height:3px;background:var(--bg);border-radius:2px;margin-top:10px;overflow:hidden;}
.sc-bar-fill{height:100%;border-radius:2px;transition:width 0.5s ease;}
.sc-overdue{font-size:10px;font-family:'DM Mono',monospace;color:#DC2626;margin-top:4px;}
.streak-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.streak-flame{font-size:32px;line-height:1;}
.streak-info h3{font-size:20px;font-weight:500;letter-spacing:-0.5px;}
.streak-info p{font-size:11px;color:var(--t2);font-family:'DM Mono',monospace;margin-top:2px;}
.overdue-banner{background:#FEF2F2;border:0.5px solid #FECACA;border-radius:var(--r2);padding:10px 14px;margin-bottom:10px;font-size:13px;color:#DC2626;}
.overdue-banner b{font-weight:500;}

/* ── Section header ── */
.sec{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.sec-hd{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;cursor:pointer;user-select:none;}
.sec-pip{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sec-name{flex:1;font-size:15px;font-weight:500;}
.sec-badge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px;}
.badge-warn{background:#FFF7ED;color:#C2410C;} .badge-ok{background:#F0FDF4;color:#15803D;} .badge-neutral{background:var(--bg);color:var(--t2);}
.sec-chev{font-size:10px;color:var(--t3);transition:transform 0.2s;margin-left:2px;}
.sec-chev.open{transform:rotate(180deg);}
.prog{height:2px;background:var(--bg);margin:0 14px;}
.prog-fill{height:100%;border-radius:1px;transition:width 0.4s;}

/* ── Task rows ── */
.task-list{padding:8px 10px 4px;}
.person-group{margin-bottom:10px;}
.person-lbl{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.07em;padding:4px 2px 5px;border-bottom:0.5px solid var(--border);margin-bottom:5px;}
.task-row{display:flex;align-items:flex-start;gap:9px;padding:8px 6px;border-radius:var(--r2);margin-bottom:2px;}
.task-row:active{background:var(--bg);}
.task-row.overdue{background:#FEF2F2;}
.chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;margin-top:1px;}
.chk.done{background:#16A34A;border-color:#16A34A;}
.chk.done::after{content:'';width:5px;height:9px;border:1.5px solid #fff;border-top:none;border-left:none;transform:rotate(42deg) translateY(-1px);display:block;}
.task-body{flex:1;min-width:0;}
.task-txt{font-size:14px;line-height:1.4;}
.task-row.done-row .task-txt{color:var(--t3);text-decoration:line-through;}
.task-meta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;}
.t-pri{font-size:10px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:4px;}
.pri-urgent{background:#FEF2F2;color:#DC2626;} .pri-high{background:#FFF7ED;color:#C2410C;} .pri-medium{background:#FEFCE8;color:#A16207;} .pri-low{background:#F0FDF4;color:#15803D;}
.t-date{font-size:10px;font-family:'DM Mono',monospace;color:var(--t2);}
.t-date.overdue{color:#DC2626;font-weight:500;}
.t-tag{font-size:10px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:4px;background:#EDE9F8;color:#7C3AED;}
.t-sched{font-size:10px;font-family:'DM Mono',monospace;color:#7C3AED;}
.task-acts{display:flex;gap:1px;flex-shrink:0;margin-top:1px;}
.act-btn{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);cursor:pointer;padding:3px 5px;border-radius:5px;opacity:0;transition:opacity 0.15s,background 0.15s;border:none;background:none;}
.task-row:hover .act-btn{opacity:1;}
.act-btn:hover{background:var(--bg);color:var(--text);}
.act-btn.del:hover{background:#FEE2E2;color:#DC2626;}
.empty-msg{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;padding:4px 2px 8px;}

/* ── Add task row ── */
.add-wrap{padding:8px 10px 10px;border-top:0.5px solid var(--border);}
.add-main{display:flex;gap:5px;margin-bottom:6px;}
.add-extras{display:flex;gap:5px;flex-wrap:wrap;}
.inp{font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 11px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--text);outline:none;}
.inp:focus{border-color:rgba(0,0,0,0.3);background:#fff;}
.inp::placeholder{color:var(--t3);}
.inp.flex1{flex:1;min-width:0;}
.sel{font-family:'DM Mono',monospace;font-size:11px;padding:9px 6px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);outline:none;cursor:pointer;}
.inp-date{font-family:'DM Mono',monospace;font-size:11px;padding:9px 8px;border-radius:var(--r2);border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);outline:none;}
.btn-add{font-size:13px;font-weight:500;padding:9px 14px;border-radius:var(--r2);border:none;background:var(--text);color:#fff;cursor:pointer;white-space:nowrap;}
.btn-add:active{opacity:0.7;}
.btn-sm{font-size:12px;padding:7px 11px;border-radius:var(--r2);border:0.5px solid var(--border2);background:transparent;color:var(--t2);cursor:pointer;white-space:nowrap;}
.btn-sm:hover{background:var(--bg);}

/* ── People ── */
.people-bar{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px;}
.person-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-family:'DM Mono',monospace;padding:4px 10px;border-radius:20px;background:#F5F3FF;border:0.5px solid rgba(147,51,234,0.2);color:#7C3AED;}
.chip-del{cursor:pointer;color:rgba(124,58,237,0.5);font-size:11px;}
.chip-del:hover{color:#DC2626;}
.add-person-row{display:flex;gap:5px;padding:0 10px 10px;}
.divider{height:0.5px;background:var(--border);margin:0 10px 8px;}

/* ── Chores ── */
.chore-list{padding:8px 10px 4px;}
.chore-row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:var(--r2);margin-bottom:3px;cursor:pointer;transition:background 0.15s;}
.chore-row:hover{background:var(--bg);}
.chore-info{flex:1;min-width:0;}
.chore-name{font-size:14px;line-height:1.3;}
.chore-last{font-size:11px;font-family:'DM Mono',monospace;margin-top:1px;}
.fresh-wrap{width:54px;flex-shrink:0;}
.fresh-track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;border:0.5px solid var(--border);margin-bottom:2px;}
.fresh-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.fresh-lbl{font-size:9px;font-family:'DM Mono',monospace;text-align:right;}
.chore-del{font-size:12px;color:var(--t3);cursor:pointer;padding:4px 5px;border-radius:5px;opacity:0;border:none;background:none;}
.chore-row:hover .chore-del{opacity:1;}
.chore-del:hover{background:#FEE2E2;color:#DC2626;}
.tap-hint{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);padding:2px 10px 8px;}

/* ── Activities ── */
.activity-types{display:flex;flex-wrap:wrap;gap:6px;padding:10px;}
.act-type-btn{font-size:12px;font-family:'DM Mono',monospace;padding:6px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg);color:var(--t2);cursor:pointer;transition:all 0.15s;}
.act-type-btn:hover,.act-type-btn.sel{background:var(--text);color:#fff;border-color:var(--text);}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px 10px;}
.week-day{display:flex;flex-direction:column;align-items:center;gap:3px;}
.wd-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--t3);}
.wd-dot{width:28px;height:28px;border-radius:50%;background:var(--bg);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);}
.wd-dot.has-act{background:var(--text);color:#fff;border-color:var(--text);}
.wd-dot.today{border:2px solid var(--chealth);}
.act-log{padding:0 10px 10px;}
.act-log-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.act-log-item:last-child{border-bottom:none;}
.act-type-badge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--t2);flex-shrink:0;}
.act-log-date{font-size:11px;font-family:'DM Mono',monospace;color:var(--t3);}
.act-log-notes{font-size:13px;flex:1;}
.log-form{padding:0 10px 12px;display:flex;flex-direction:column;gap:6px;}

/* ── Questions ── */
.q-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px;text-align:center;}
.q-label{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;}
.q-text{font-size:17px;font-weight:300;line-height:1.5;letter-spacing:-0.2px;min-height:80px;display:flex;align-items:center;justify-content:center;}
.q-btn{font-size:13px;font-weight:500;padding:11px 20px;border-radius:var(--r2);border:none;background:var(--csocial);color:#fff;cursor:pointer;margin-top:16px;width:100%;}
.q-btn:active{opacity:0.8;}
.q-count{font-size:10px;font-family:'DM Mono',monospace;color:var(--t3);margin-top:8px;}

/* ── Modal ── */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
.modal-back.hide{display:none;}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + var(--safe-b));width:100%;max-width:480px;}
.modal h3{font-size:16px;font-weight:500;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;margin-bottom:18px;}
.modal-btn{display:block;width:100%;text-align:left;font-family:'DM Sans',sans-serif;font-size:15px;padding:14px 16px;border-radius:var(--r2);border:0.5px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;margin-bottom:8px;}
.modal-btn:active{opacity:0.7;}
.modal-cancel{background:transparent;border-color:transparent;color:var(--t3);}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;font-size:13px;font-family:'DM Mono',monospace;padding:10px 18px;border-radius:20px;opacity:0;transition:all 0.3s;z-index:300;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading{text-align:center;padding:48px 0;color:var(--t3);font-size:13px;font-family:'DM Mono',monospace;}
.loading::after{content:'...';animation:dots 1.2s infinite;}
@keyframes dots{0%{content:'.'}33%{content:'..'}66%{content:'...'}}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <!-- HOME / SUMMARY -->
    <div class="tab-pane active" id="pane-home">
      <div class="topbar">
        <div class="topbar-left"><h1>my<br/><b>dashboard</b></h1></div>
        <div class="topbar-date" id="top-date"></div>
      </div>
      <div class="sync-row"><div class="sync-pip" id="sync-pip"></div><span class="sync-txt" id="sync-txt">connecting</span></div>
      <div id="home-content"><div class="loading">loading</div></div>
    </div>
    <!-- HEALTH -->
    <div class="tab-pane" id="pane-health">
      <div class="topbar"><div class="topbar-left"><h1><b>Health</b></h1></div></div>
      <div id="health-content"><div class="loading">loading</div></div>
    </div>
    <!-- SOCIAL -->
    <div class="tab-pane" id="pane-social">
      <div class="topbar"><div class="topbar-left"><h1><b>Social</b></h1></div></div>
      <div id="social-content"><div class="loading">loading</div></div>
    </div>
    <!-- WORK -->
    <div class="tab-pane" id="pane-work">
      <div class="topbar"><div class="topbar-left"><h1><b>Work</b></h1></div></div>
      <div id="work-content"><div class="loading">loading</div></div>
    </div>
    <!-- CHORES -->
    <div class="tab-pane" id="pane-chores">
      <div class="topbar"><div class="topbar-left"><h1><b>Home</b></h1></div></div>
      <div id="chores-content"><div class="loading">loading</div></div>
    </div>
  </div>

  <!-- Tab bar -->
  <nav id="tabs">
    <button class="tab-btn active" data-tab="home">
      <span class="tab-icon">◎</span><span class="tab-label">Summary</span>
    </button>
    <button class="tab-btn" data-tab="health">
      <span class="tab-icon">◈</span><span class="tab-label">Health</span>
    </button>
    <button class="tab-btn" data-tab="social">
      <span class="tab-icon">◇</span><span class="tab-label">Social</span>
    </button>
    <button class="tab-btn" data-tab="work">
      <span class="tab-icon">◆</span><span class="tab-label">Work</span>
    </button>
    <button class="tab-btn" data-tab="chores">
      <span class="tab-icon">◉</span><span class="tab-label">Home</span>
    </button>
  </nav>
</div>

<!-- Chore modal -->
<div class="modal-back hide" id="chore-modal">
  <div class="modal">
    <h3 id="cm-title"></h3>
    <div class="modal-sub" id="cm-sub"></div>
    <button class="modal-btn" id="cm-confirm">Yes — just did this</button>
    <button class="modal-btn modal-cancel" onclick="closeModal('chore-modal')">Cancel</button>
  </div>
</div>
<!-- Activity log modal -->
<div class="modal-back hide" id="act-modal">
  <div class="modal">
    <h3>Log activity</h3>
    <div class="modal-sub" id="act-modal-type"></div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
      <input class="inp" id="act-notes" placeholder="Notes (optional)" />
      <input class="inp" id="act-duration" placeholder="Duration (e.g. 45 min)" />
    </div>
    <button class="modal-btn" id="act-confirm">Log it</button>
    <button class="modal-btn modal-cancel" onclick="closeModal('act-modal')">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx8LVK-TFR1xXsu2Bis8tAt1ERERXN5__wVsbaA_MEY_dm8Fqw-r_lc3ihIHa3EDmDr9w/exec';

// ── State ─────────────────────────────────────────────────────────────────────
let S = {
  tasks:[], chores:[], people:{social:[],work:[]},
  activities:[], questions:[], gamification:{xp:0,level:1,streakDays:0,lastActiveDate:'',badges:[]},
  nextId: Date.now(), saveTimer:null, currentTab:'home',
  pendingChoreId:null, pendingActType:null, questionIdx:0,
};

const DEFAULT_CHORES = [
  {id:'c1',name:'Order paper towels',intervalDays:14,lastDone:null},
  {id:'c2',name:'Order toilet paper',intervalDays:14,lastDone:null},
  {id:'c3',name:'Order mouthwash & toothpaste',intervalDays:21,lastDone:null},
  {id:'c4',name:'Vacuum apartment',intervalDays:7,lastDone:null},
  {id:'c5',name:'Mop apartment',intervalDays:14,lastDone:null},
  {id:'c6',name:'Clean bathroom',intervalDays:7,lastDone:null},
  {id:'c7',name:'Clean tub',intervalDays:14,lastDone:null},
  {id:'c8',name:'Make grocery list',intervalDays:7,lastDone:null},
  {id:'c9',name:'Do laundry',intervalDays:7,lastDone:null},
  {id:'c10',name:'Change bed sheets',intervalDays:14,lastDone:null},
  {id:'c11',name:'Take out trash',intervalDays:4,lastDone:null},
  {id:'c12',name:'Wipe down kitchen surfaces',intervalDays:5,lastDone:null},
  {id:'c13',name:'Clean out fridge',intervalDays:14,lastDone:null},
];

const ACTIVITY_TYPES = ['bowling','volleyball','workout','yoga','run','walk','other'];
const LEVEL_THRESHOLDS = [0,100,250,500,900,1500,2500,4000,6000,9000,13000];
const BADGES = [
  {id:'first_task',    label:'First step',   desc:'Complete your first task',        check:g=>g.xp>=10},
  {id:'streak3',       label:'On a roll',    desc:'3-day streak',                    check:g=>g.streakDays>=3},
  {id:'streak7',       label:'Week warrior', desc:'7-day streak',                    check:g=>g.streakDays>=7},

// ── Date helpers ──────────────────────────────────────────────────────────────
const today = new Date();
const todayStr = today.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const todayIso = today.toISOString().split('T')[0];
document.getElementById('top-date').innerHTML =
  today.toLocaleDateString('en-US',{weekday:'long'})+'<br>'+
  today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

function isOverdue(dueDate) {
  if (!dueDate) return false;
  return new Date(dueDate) < new Date(todayIso);
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function isScheduledToday(t) {
  if (!t.scheduledFor) return true;
  return t.scheduledFor === todayStr;
}

// ── Sync UI ───────────────────────────────────────────────────────────────────
function setSync(state, txt) {
  document.getElementById('sync-pip').className = 'sync-pip ' + state;
  document.getElementById('sync-txt').textContent = txt;
}
function toast(msg, dur=2500) {

}

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadData() {
  setSync('syncing','loading');
  try {
    const res = await fetch(API + '?action=getData');
    const data = await res.json();
    if (data.tasks) S.tasks = data.tasks.map(t=>({...t,done:t.done===true||t.done==='TRUE',tags:Array.isArray(t.tags)?t.tags:(t.tags?String(t.tags).split(',').filter(Boolean):[]),dueDate:t.dueDate||'',priority:t.priority||''}));
    if (data.chores && data.chores.length) S.chores = data.chores;
    else S.chores = JSON.parse(JSON.stringify(DEFAULT_CHORES));
    if (data.people) S.people = {social:data.people.social||[],work:data.people.work||[]};
    if (data.activities) S.activities = data.activities;
    if (data.questions && data.questions.length) S.questions = data.questions;
    if (data.gamification) S.gamification = {...S.gamification,...data.gamification,badges:Array.isArray(data.gamification.badges)?data.gamification.badges:(data.gamification.badges?String(data.gamification.badges).split(',').filter(Boolean):[])};
    if (S.tasks.length) S.nextId = Math.max(...S.tasks.map(t=>Number(t.id)||0), S.nextId) + 1;
    updateStreak();
    setSync('synced','synced');
  } catch(e) { setSync('error','offline'); }
  renderAll();
}

async function saveAll() {
  setSync('syncing','saving');
  try {
    await fetch(API,{method:'POST',body:JSON.stringify({action:'saveData',tasks:S.tasks,chores:S.chores,people:S.people,gamification:S.gamification})});
    setSync('synced','saved');
  } catch(e) { setSync('error','save failed'); }
}
function scheduleSave() { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(saveAll, 1200); }

// ── Gamification ──────────────────────────────────────────────────────────────
function addXP(amount, reason) {
  S.gamification.xp += amount;
  const newLevel = LEVEL_THRESHOLDS.findIndex((t,i)=> S.gamification.xp < (LEVEL_THRESHOLDS[i+1]||Infinity));
  if (newLevel > S.gamification.level) { S.gamification.level = newLevel; toast('Level up! You\'re now level '+newLevel+' ✦'); }
  checkBadges();
}
function checkBadges() {
  BADGES.forEach(b => {
    if (!S.gamification.badges.includes(b.id) && b.check(S.gamification, S.tasks, S.activities)) {
      S.gamification.badges.push(b.id);
      toast('Badge unlocked: '+b.label+' ✦', 3500);
    }
  });
}
function updateStreak() {
  const last = S.gamification.lastActiveDate;
  if (!last) return;
  const lastDt = new Date(last);
  const diffDays = Math.floor((today - lastDt) / 86400000);
  if (diffDays > 1) S.gamification.streakDays = 0;
}
function markActiveToday() {
  const last = S.gamification.lastActiveDate;
  if (last === todayIso) return;
  const lastDt = last ? new Date(last) : null;
  const diffDays = lastDt ? Math.floor((today - lastDt) / 86400000) : 999;
  if (diffDays === 1) S.gamification.streakDays++;
  else if (diffDays > 1) S.gamification.streakDays = 1;
  else S.gamification.streakDays = Math.max(1, S.gamification.streakDays);
  S.gamification.lastActiveDate = todayIso;
}
function levelLabel(lvl) {
  const labels = ['Newcomer','Starter','Builder','Achiever','Consistent','Dedicated','Focused','Expert','Elite','Champion','Legend'];
  return labels[Math.min(lvl,labels.length-1)] || 'Legend';
}
function xpForNext(lvl) { return LEVEL_THRESHOLDS[lvl+1] || LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length-1]; }
function xpPct() {
  const lvl = S.gamification.level;
  const base = LEVEL_THRESHOLDS[lvl] || 0;
  const next = LEVEL_THRESHOLDS[lvl+1] || base+1000;
  return Math.min(100, Math.round((S.gamification.xp - base)/(next-base)*100));
}

// ── Freshness ─────────────────────────────────────────────────────────────────
function freshness(c) {
  if (!c.lastDone) return {pct:0,color:'#DC2626',label:'never'};
  const days = (Date.now()-new Date(c.lastDone))/86400000;
  const ratio = Math.max(0,1-days/c.intervalDays);
  const pct = Math.round(ratio*100);
  const color = ratio<0.25?'#DC2626':ratio<0.5?'#D97706':ratio<0.75?'#CA8A04':'#16A34A';
  const d = Math.round(days);
  return {pct,color,label:d===0?'today':d+'d ago'};
}

// ── Task actions ──────────────────────────────────────────────────────────────
function toggleTask(id) {
  const t = S.tasks.find(t=>t.id==id);
  if (!t) return;
  t.done = !t.done;
  if (t.done) { addXP(t.priority==='urgent'?20:t.priority==='high'?15:t.priority==='medium'?10:5); markActiveToday(); }
  renderAll(); scheduleSave();
}
function deleteTask(id) { S.tasks=S.tasks.filter(t=>t.id!=id); renderAll(); scheduleSave(); }
function dupeTask(id) {
  const t = S.tasks.find(t=>t.id==id);
  if (!t) return;
  const next = new Date(); next.setDate(next.getDate()+7);
  const label = next.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  S.tasks.push({...t,id:S.nextId++,done:false,scheduledFor:label,dueDate:''});
  renderAll(); scheduleSave();
  toast('Duped → '+label);
}
function addTask(section,text,priority,dueDate,personId,tags) {
  if (!text.trim()) return;
  S.tasks.push({id:S.nextId++,section,text:text.trim(),done:false,priority:priority||'',dueDate:dueDate||'',personId:personId||'',tags:tags||[],scheduledFor:'',createdAt:new Date().toISOString()});
  markActiveToday(); renderAll(); scheduleSave();
}

// ── Chore actions ─────────────────────────────────────────────────────────────
function openChoreModal(id) {
  const c = S.chores.find(c=>c.id==id);
  if (!c) return;
  S.pendingChoreId = id;
  document.getElementById('cm-title').textContent = c.name;

}
function confirmChore() {
  const c = S.chores.find(c=>c.id==S.pendingChoreId);

  closeModal('chore-modal');
}
function deleteChore(id) { S.chores=S.chores.filter(c=>c.id!=id); renderAll(); scheduleSave(); }
function addChore(name) {

  S.chores.push({id:'c'+S.nextId++,name:name.trim(),intervalDays:7,lastDone:null});

}

// ── People actions ────────────────────────────────────────────────────────────
function addPerson(sec,name) {
  if (!name.trim()) return;
  if (!S.people[sec]) S.people[sec]=[];
  S.people[sec].push({id:'p'+S.nextId++,name:name.trim()});

function deletePerson(sec,id) {

// ── HOME / SUMMARY ────────────────────────────────────────────────────────────
function renderHome() {
  const g = S.gamification;
  const lvl = g.level; const pct = xpPct();
  const activeTasks = S.tasks.filter(t=>!t.scheduledFor||isScheduledToday(t));
  const overdue = activeTasks.filter(t=>!t.done&&isOverdue(t.dueDate));
  const staleChores = S.chores.filter(c=>freshness(c).pct<50).length;

  // Per-section stats
  const secStats = {
    health: sectionStat('health',activeTasks),
    social: sectionStat('social',activeTasks),
    work:   sectionStat('work',activeTasks),
  };
  const actThisWeek = S.activities.filter(a=>{ const d=new Date(a.date); const diff=(today-d)/86400000; return diff<=7; }).length;

  const badges = BADGES.filter(b=>g.badges.includes(b.id));

  let html = `
    <div class="xp-bar-wrap">
      <div class="xp-top">
        <span class="xp-level">Level ${lvl} — ${levelLabel(lvl)}</span>
        <span class="xp-pts">${g.xp} XP</span>
      </div>
      <div class="xp-track"><div class="xp-fill" style="width:${pct}%"></div></div>
      ${badges.length?`<div class="xp-badges">${badges.map(b=>`<span class="badge-pill">✦ ${b.label}</span>`).join('')}</div>`:''}
    </div>`;

  if (g.streakDays >= 2) {
    html += `<div class="streak-card">
      <div class="streak-flame">${g.streakDays>=7?'🔥':'⚡'}</div>
      <div class="streak-info"><h3>${g.streakDays}-day streak</h3><p>keep it going — don't break the chain</p></div>
    </div>`;
  }

  if (overdue.length) {
    html += `<div class="overdue-banner"><b>${overdue.length} overdue task${overdue.length>1?'s':''}</b> — check your sections</div>`;
  }

  html += `<div class="summary-grid">`;
  // Health card
  html += summaryCard('Health','◈','var(--chealth)',secStats.health,activeTasks,'health',`${actThisWeek} activities this week`);
  // Social card
  html += summaryCard('Social','◇','var(--csocial)',secStats.social,activeTasks,'social',`${(S.people.social||[]).length} people`);
  // Work card
  html += summaryCard('Work','◆','var(--cwork)',secStats.work,activeTasks,'work','');
  // Home card (chores)
  html += `<div class="summary-card" onclick="switchTab('chores')">
    <div class="sc-accent" style="background:var(--cchores)"></div>
    <div class="sc-label">Home</div>
    <div class="sc-big">${staleChores}</div>
    <div class="sc-sub">chores need attention</div>
    <div class="sc-bar"><div class="sc-bar-fill" style="width:${Math.round((S.chores.length-staleChores)/Math.max(S.chores.length,1)*100)}%;background:var(--cchores)"></div></div>
  </div>`;
  html += `</div>`;

  document.getElementById('home-content').innerHTML = html;
}

function sectionStat(sec, tasks) {
  const all = tasks.filter(t=>t.section===sec);
  const done = all.filter(t=>t.done).length;
  const over = all.filter(t=>!t.done&&isOverdue(t.dueDate)).length;
  return {all:all.length,done,pending:all.length-done,over};
}

function summaryCard(name,icon,color,stat,tasks,tab,extra) {
  const pct = stat.all ? Math.round(stat.done/stat.all*100) : 0;
  return `<div class="summary-card" onclick="switchTab('${tab}')">
    <div class="sc-accent" style="background:${color}"></div>
    <div class="sc-label">${name}</div>
    <div class="sc-big">${stat.pending}</div>
    <div class="sc-sub">${stat.done}/${stat.all} done${extra?' · '+extra:''}</div>
    ${stat.over?`<div class="sc-overdue">${stat.over} overdue</div>`:''}
    <div class="sc-bar"><div class="sc-bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

      </div>
      <div class="add-extras">
        <input class="inp" id="tags-work" placeholder="#tag" style="width:80px;flex:none"/>
        <select class="sel" id="pri-work"><option value="">priority</option><option value="urgent">urgent</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
        <input class="inp-date" type="date" id="date-work" />
      </div>
    </div>
  </div>`;
  document.getElementById('work-content').innerHTML = html;
  bindTaskEvents('work');
}

// ── CHORES ────────────────────────────────────────────────────────────────────
function renderChores() {
  const sorted = [...S.chores].sort((a,b)=>freshness(a).pct-freshness(b).pct);
  const stale = sorted.filter(c=>freshness(c).pct<50).length;
  let html = `<div class="sec">
    <div class="sec-hd" style="cursor:default">
      <div class="sec-pip" style="background:var(--cchores)"></div>
      <div class="sec-name">Recurring chores</div>
      <span class="sec-badge ${stale?'badge-warn':'badge-ok'}">${stale?stale+' stale':'all fresh'}</span>
    </div>
    <div class="chore-list">
      ${!sorted.length?'<div class="empty-msg">no chores yet</div>':''}
      ${sorted.map(c=>{
        const f=freshness(c);
        return `<div class="chore-row" data-chore="${c.id}">
          <div class="chore-info">
            <div class="chore-name">${escHtml(c.name)}</div>
            <div class="chore-last" style="color:${f.color}">${f.label} · every ${c.intervalDays}d</div>
          </div>
          <div class="fresh-wrap">
            <div class="fresh-track"><div class="fresh-fill" style="width:${f.pct}%;background:${f.color}"></div></div>
            <div class="fresh-lbl" style="color:${f.color}">${f.pct}%</div>
          </div>
          <button class="chore-del" data-choredel="${c.id}">✕</button>
        </div>`;
      }).join('')}
    </div>
    <div class="tap-hint">tap a chore to mark it done</div>
    <div class="add-wrap">
      <div class="add-main">
        <input class="inp flex1" id="chore-inp" placeholder="Add a chore..." />
        <button class="btn-add" id="chore-add-btn">Add</button>
      </div>
    </div>
  </div>`;
  document.getElementById('chores-content').innerHTML = html;

  document.querySelectorAll('.chore-row').forEach(el=>{
    el.addEventListener('click',e=>{ if(!e.target.closest('[data-choredel]')) openChoreModal(el.dataset.chore); });
  });
  document.querySelectorAll('[data-choredel]').forEach(el=>{
    el.addEventListener('click',e=>{ e.stopPropagation(); deleteChore(el.dataset.choredel); });
  });
  const addBtn=document.getElementById('chore-add-btn');
  const addInp=document.getElementById('chore-inp');
  if(addBtn) addBtn.addEventListener('click',()=>{ if(addInp?.value.trim()){addChore(addInp.value);addInp.value='';} });
  if(addInp) { addInp.addEventListener('keydown',e=>{ if(e.key==='Enter')addBtn?.click(); }); addInp.addEventListener('click',e=>e.stopPropagation()); }
}

// ── Shared task section renderer ──────────────────────────────────────────────
function renderTaskSection(secId, title, color, tasks) {
  const pending = tasks.filter(t=>!t.done).length;
  const pct = tasks.length ? Math.round(tasks.filter(t=>t.done).length/tasks.length*100) : 0;
  return `<div class="sec">
    <div class="sec-hd" style="cursor:default">
      <div class="sec-pip" style="background:${color}"></div>
      <div class="sec-name">${title}</div>
      <span class="sec-badge ${pending?'badge-warn':'badge-ok'}">${pending} left</span>
    </div>
    <div class="prog"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="task-list">
      ${!tasks.length?'<div class="empty-msg">no tasks yet</div>':''}
      ${tasks.map(t=>taskRowHtml(t)).join('')}
    </div>
    <div class="add-wrap">
      <div class="add-main">
        <input class="inp flex1" id="inp-${secId}" placeholder="Add a task..." />
        <button class="btn-add" data-addbtn="${secId}">Add</button>
      </div>
      <div class="add-extras">
        <select class="sel" id="pri-${secId}"><option value="">priority</option><option value="urgent">urgent</option><option value="high">high</option><option value="medium">medium</option><option value="low">low</option></select>
        <input class="inp-date" type="date" id="date-${secId}" />
      </div>
    </div>
  </div>`;
}

function taskRowHtml(t) {
  const over = !t.done && isOverdue(t.dueDate);
  const tags = Array.isArray(t.tags)?t.tags:[];
  const hasMeta = t.priority||t.dueDate||(tags.length>0)||t.scheduledFor;
  return `<div class="task-row ${t.done?'done-row':''} ${over?'overdue':''}">
    <div class="chk ${t.done?'done':''}" data-check="${t.id}"></div>
    <div class="task-body">
      <div class="task-txt">${escHtml(t.text)}</div>
      ${hasMeta?`<div class="task-meta">
        ${t.priority?`<span class="t-pri pri-${t.priority}">${t.priority}</span>`:''}
        ${t.dueDate?`<span class="t-date ${over?'overdue':''}">${over?'overdue · ':''} ${fmtDate(t.dueDate)}</span>`:''}
        ${tags.map(tg=>`<span class="t-tag">#${escHtml(tg)}</span>`).join('')}
        ${t.scheduledFor?`<span class="t-sched">→ ${escHtml(t.scheduledFor)}</span>`:''}
      </div>`:''}
    </div>
    <div class="task-acts">
      <button class="act-btn" data-dupe="${t.id}">+7d</button>
      <button class="act-btn del" data-del="${t.id}">✕</button>
    </div>
  </div>`;
}

function bindTaskEvents(secId) {
  document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('click',()=>toggleTask(el.dataset.check)));
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>deleteTask(el.dataset.del)));
  document.querySelectorAll('[data-dupe]').forEach(el=>el.addEventListener('click',()=>dupeTask(el.dataset.dupe)));

  const addBtn = document.querySelector(`[data-addbtn="${secId}"]`);
  if (addBtn) {
    addBtn.addEventListener('click',()=>{
      const inp = document.getElementById('inp-'+secId);
      if (!inp?.value.trim()) return;
      const pri  = document.getElementById('pri-'+secId)?.value;
      const date = document.getElementById('date-'+secId)?.value;
      const ps   = document.getElementById('person-sel-'+secId)?.value;
      const ti   = document.getElementById('tags-'+secId);
      const tags = ti ? ti.value.split(/[\s,]+/).map(t=>t.replace(/^#/,'')).filter(Boolean) : [];
      addTask(secId,inp.value,pri,date,ps,tags);
      inp.value=''; if(ti)ti.value='';
      const ds=document.getElementById('date-'+secId); if(ds)ds.value='';
      const ps2=document.getElementById('pri-'+secId); if(ps2)ps2.value='';
    });
  }
  const mainInp = document.getElementById('inp-'+secId);
  if (mainInp) {
    mainInp.addEventListener('keydown',e=>{ if(e.key==='Enter') addBtn?.click(); });
    mainInp.addEventListener('click',e=>e.stopPropagation());
  }
}

// ── Tab nav ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
});
document.getElementById('chore-modal').addEventListener('click',e=>{if(e.target===document.getElementById('chore-modal'))closeModal('chore-modal');});
document.getElementById('act-modal').addEventListener('click',e=>{if(e.target===document.getElementById('act-modal'))closeModal('act-modal');});

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadData();
</script>
</body>
</html>
